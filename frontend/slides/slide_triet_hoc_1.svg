<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#bg1)"/>
  
  <!-- Slide Header -->
  <rect x="40" y="30" width="170" height="32" rx="16" fill="#4f46e5"/>
  <text x="125" y="51" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">SLIDE 01 / BÀI GIẢNG</text>
  <text x="40" y="105" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="900">VẤN ĐỀ CƠ BẢN CỦA TRIẾT HỌC</text>
  <text x="40" y="135" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="15">Mối quan hệ biện chứng giữa tư duy và tồn tại, giữa ý thức và vật chất</text>
  
  <!-- Card 1: Bản thể luận -->
  <rect x="40" y="170" width="425" height="320" rx="20" fill="url(#card1)" stroke="#6366f1" stroke-width="1.5"/>
  <rect x="65" y="195" width="130" height="28" rx="8" fill="#3b82f6"/>
  <text x="130" y="214" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">MẶT THỨ NHẤT</text>
  <text x="65" y="255" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">BẢN THỂ LUẬN</text>
  <text x="65" y="285" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14">Cái nào có trước, cái nào quyết định cái nào?</text>
  
  <rect x="65" y="310" width="375" height="75" rx="12" fill="#0f172a" fill-opacity="0.7" stroke="#334155"/>
  <text x="80" y="335" fill="#34d399" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">✓ Chủ nghĩa duy vật:</text>
  <text x="80" y="360" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Vật chất có trước, sinh ra và quyết định ý thức.</text>
  
  <rect x="65" y="395" width="375" height="75" rx="12" fill="#0f172a" fill-opacity="0.7" stroke="#334155"/>
  <text x="80" y="420" fill="#f87171" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">✗ Chủ nghĩa duy tâm:</text>
  <text x="80" y="445" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Ý thức/tinh thần có trước, quyết định vật chất.</text>

  <!-- Card 2: Nhận thức luận -->
  <rect x="495" y="170" width="425" height="320" rx="20" fill="url(#card1)" stroke="#a855f7" stroke-width="1.5"/>
  <rect x="520" y="195" width="130" height="28" rx="8" fill="#9333ea"/>
  <text x="585" y="214" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">MẶT THỨ HAI</text>
  <text x="520" y="255" fill="#c084fc" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">NHẬN THỨC LUẬN</text>
  <text x="520" y="285" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14">Con người có khả năng nhận thức thế giới không?</text>
  
  <rect x="520" y="310" width="375" height="75" rx="12" fill="#0f172a" fill-opacity="0.7" stroke="#334155"/>
  <text x="535" y="335" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">✓ Thuyết khả tri (Gnosticism):</text>
  <text x="535" y="360" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Khẳng định con người có thể nhận thức bản chất sự vật.</text>
  
  <rect x="520" y="395" width="375" height="75" rx="12" fill="#0f172a" fill-opacity="0.7" stroke="#334155"/>
  <text x="535" y="420" fill="#fb923c" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">✗ Thuyết bất khả tri (Agnosticism):</text>
  <text x="535" y="445" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Nghi ngờ hoặc phủ nhận khả năng nhận thức bản chất.</text>
</svg>