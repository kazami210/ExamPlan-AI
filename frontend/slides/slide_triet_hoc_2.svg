<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#bg2)"/>
  
  <!-- Header -->
  <rect x="40" y="30" width="170" height="32" rx="16" fill="#0284c7"/>
  <text x="125" y="51" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">SLIDE 02 / BÀI GIẢNG</text>
  <text x="40" y="105" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="900">HỆ THỐNG PHÉP BIỆN CHỨNG DUY VẬT</text>
  <text x="40" y="135" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15">Cấu trúc cốt lõi: 2 Nguyên Lý • 3 Quy Luật • 6 Cặp Phạm Trù</text>

  <!-- Box 1: 2 Nguyên lý -->
  <rect x="40" y="170" width="270" height="320" rx="16" fill="#1e1b4b" stroke="#4338ca" stroke-width="1.5"/>
  <text x="60" y="210" fill="#818cf8" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">2 NGUYÊN LÝ LỚN</text>
  <line x1="60" y1="225" x2="280" y2="225" stroke="#312e81" stroke-width="2"/>
  
  <rect x="55" y="245" width="240" height="100" rx="10" fill="#312e81" fill-opacity="0.5"/>
  <text x="70" y="275" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">1. Mối liên hệ phổ biến</text>
  <text x="70" y="300" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Vạn vật luôn ràng buộc, tác</text>
  <text x="70" y="320" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">động qua lại và chuyển hóa.</text>
  
  <rect x="55" y="360" width="240" height="100" rx="10" fill="#312e81" fill-opacity="0.5"/>
  <text x="70" y="390" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">2. Sự phát triển</text>
  <text x="70" y="415" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Vận động theo hướng đi lên,</text>
  <text x="70" y="435" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">từ đơn giản đến phức tạp.</text>

  <!-- Box 2: 3 Quy luật -->
  <rect x="330" y="170" width="300" height="320" rx="16" fill="#064e3b" fill-opacity="0.4" stroke="#059669" stroke-width="1.5"/>
  <text x="350" y="210" fill="#34d399" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">3 QUY LUẬT CƠ BẢN</text>
  <line x1="350" y1="225" x2="600" y2="225" stroke="#047857" stroke-width="2"/>
  
  <text x="350" y="260" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">1. Lượng - Chất:</text>
  <text x="350" y="285" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Chỉ ra CÁCH THỨC của sự vận động.</text>
  
  <text x="350" y="335" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">2. Mâu thuẫn (Mặt đối lập):</text>
  <text x="350" y="360" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Chỉ ra NGUỒN GỐC, ĐỘNG LỰC.</text>
  
  <text x="350" y="410" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">3. Phủ định của phủ định:</text>
  <text x="350" y="435" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Chỉ ra KHUYNH HƯỚNG của phát triển.</text>

  <!-- Box 3: 6 Cặp phạm trù -->
  <rect x="650" y="170" width="270" height="320" rx="16" fill="#701a75" fill-opacity="0.3" stroke="#a21caf" stroke-width="1.5"/>
  <text x="670" y="210" fill="#f472b6" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">6 CẶP PHẠM TRÙ</text>
  <line x1="670" y1="225" x2="890" y2="225" stroke="#86198f" stroke-width="2"/>
  
  <text x="670" y="260" fill="#fbcfe8" font-family="system-ui, sans-serif" font-size="13">• Cái riêng và Cái chung</text>
  <text x="670" y="295" fill="#fbcfe8" font-family="system-ui, sans-serif" font-size="13">• Nguyên nhân và Kết quả</text>
  <text x="670" y="330" fill="#fbcfe8" font-family="system-ui, sans-serif" font-size="13">• Tất nhiên và Ngẫu nhiên</text>
  <text x="670" y="365" fill="#fbcfe8" font-family="system-ui, sans-serif" font-size="13">• Nội dung và Hình thức</text>
  <text x="670" y="400" fill="#fbcfe8" font-family="system-ui, sans-serif" font-size="13">• Bản chất và Hiện tượng</text>
  <text x="670" y="435" fill="#fbcfe8" font-family="system-ui, sans-serif" font-size="13">• Khả năng và Hiện thực</text>
</svg>