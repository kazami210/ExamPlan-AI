<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#164e63"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>
  
  <rect x="40" y="30" width="200" height="32" rx="16" fill="#ffffff" fill-opacity="0.2"/>
  <text x="140" y="51" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">SLIDE 02 / 02 • CHƯƠNG 4</text>
  <text x="40" y="105" fill="#ffffff" font-family="system-ui, sans-serif" font-size="26" font-weight="900">CHƯƠNG 4: ĐỊNH LÝ AMPERE VỀ LƯU SỐ TỪ TRƯỜNG</text>
  <text x="40" y="135" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="15">Lưu số cảm ứng từ và ứng dụng ống dây Solenoid</text>

  <rect x="40" y="165" width="880" height="330" rx="20" fill="#000000" fill-opacity="0.35" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5"/>

  <circle cx="75" cy="215" r="15" fill="#ffffff" fill-opacity="0.25"/>
  <text x="75" y="220" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">1</text>
  <text x="105" y="210" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Định lý Ampere (Định lý dòng toàn phần)</text>
  <text x="105" y="237" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">Lưu số của vector B dọc theo đường cong kín C bằng mu0 nhân tổng đại số các dòng điện xuyên qua C.</text>

  <circle cx="75" cy="303" r="15" fill="#ffffff" fill-opacity="0.25"/>
  <text x="75" y="308" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">2</text>
  <text x="105" y="298" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Từ trường trong ống dây Solenoid</text>
  <text x="105" y="325" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">Bên trong ống dây dài: B = mu0 * n * I (n là mật độ vòng dây trên mỗi mét chiều dài).</text>

  <circle cx="75" cy="391" r="15" fill="#ffffff" fill-opacity="0.25"/>
  <text x="75" y="396" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">3</text>
  <text x="105" y="386" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Lực Lorentz và Lực Ampere</text>
  <text x="105" y="413" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">Lực Ampere: F = I [l, B]; Lực Lorentz tác dụng lên hạt mang điện chuyển động: F = q [v, B].</text>
</svg>